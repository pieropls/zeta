<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E9EBEE">
<title>Grid bets</title>
<style>
:root{
  --paper:#E9EBEE; --card:#FFF; --ink:#14161A; --muted:#71767F; --line:#DCE0E5;
  --long:#0B7A63; --short:#AF382C; --longbg:#E3F1ED; --shortbg:#F7E6E3;
  --r:10px;
  --sans:ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;
  padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));
  gap:8px;touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}

.out{background:var(--card);border-radius:var(--r);padding:12px 14px 11px;flex:0 0 auto}
.val{display:flex;align-items:baseline;gap:11px;min-height:50px}
.num{font-family:var(--mono);font-size:clamp(40px,7vh,54px);font-weight:600;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;transition:color .12s}
.num.pos{color:var(--long)} .num.neg{color:var(--short)} .num.zero,.num.none{color:var(--muted)}
.expr{font-family:var(--mono);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs{display:flex;gap:5px;margin-top:8px;min-height:22px;align-items:center}
.leg{font-family:var(--mono);font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:6px}
.leg.p{background:var(--longbg);color:var(--long)} .leg.m{background:var(--shortbg);color:var(--short)}
.note{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.note.warn{color:var(--short)}

.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;flex:0 0 auto}
.sh{background:var(--card);border-radius:var(--r);padding:11px 0;font-family:var(--mono);font-size:17px;
  font-weight:700;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;transition:background .1s}
.sh i{font-style:normal}
.sh .a{color:var(--long)} .sh .b{color:var(--short)}
.sh.on{background:var(--ink)} .sh.on .a,.sh.on .b{color:#fff}

.entry{background:var(--card);border-radius:var(--r);display:flex;align-items:center;gap:10px;
  padding:0 14px;flex:0 0 auto}
.caret{font-family:var(--mono);font-size:20px;color:var(--muted);flex:0 0 auto}
#in{flex:1;border:none;outline:none;background:none;font-family:var(--mono);font-size:24px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:14px 0;min-width:0;color:var(--ink)}
#in::placeholder{color:var(--line);text-transform:none;letter-spacing:0;font-size:17px;font-weight:400}

.logwrap{background:var(--card);border-radius:var(--r);flex:1 1 auto;min-height:0;display:flex;
  flex-direction:column;padding:9px 6px 6px}
.loghd{display:flex;align-items:center;padding:0 8px 7px;font-size:12.5px;color:var(--muted)}
.loghd button{font-size:12.5px;color:var(--muted);margin-left:auto;text-decoration:underline;
  text-underline-offset:2px}
.log{overflow-y:auto;flex:1 1 auto;-webkit-overflow-scrolling:touch}
.log:empty::after{content:"Press enter to bank a result here.";display:block;padding:4px 8px;
  font-size:13px;color:var(--line)}
.e{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;
  font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.e+.e{margin-top:1px}
.e .b{font-weight:600;letter-spacing:.04em}
.e .w{font-size:12px;color:var(--muted)}
.e .v{margin-left:auto;font-weight:600;font-size:16px}
.e .v.pos{color:var(--long)} .e .v.neg{color:var(--short)} .e .v.zero{color:var(--muted)}
.e.best{background:var(--longbg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:520px){body{max-width:460px;margin:0 auto}}
</style>
</head>
<body>

<div class="out">
  <div class="val"><div class="num none" id="num">&mdash;</div><div class="expr" id="expr"></div></div>
  <div class="legs"><span id="legs"></span><span class="note" id="note"></span></div>
</div>

<div class="shapes" id="shapes"></div>

<div class="entry">
  <span class="caret">&rsaquo;</span>
  <input id="in" placeholder="ad5" autocomplete="off" autocorrect="off" autocapitalize="off"
         spellcheck="false" enterkeyhint="done" aria-label="Bet entry">
</div>

<div class="logwrap">
  <div class="loghd"><span>Last 10</span><button id="clr">clear</button></div>
  <div class="log" id="log"></div>
</div>

<script>
var LEFT="ABCDEFGHIJKLM", RIGHT="NOPQRSTUVWXYZ";
function rowOf(c){var i=LEFT.indexOf(c);return i>=0?i+1:RIGHT.indexOf(c)+1;}
function fmt(v){return v>0?"+"+v:v<0?"\u2212"+Math.abs(v):"0";}

var SHAPES=[["++",[1,1]],["+\u2212",[1,-1]],["\u2212\u2212",[-1,-1]],["+",[1]],["\u2212",[-1]]];
var shape=0, log=[];

var inp=document.getElementById("in"), frozen=null;

function parse(txt,sg){
  var legs=[], dig="", err=null;
  txt=txt.toUpperCase();
  for(var i=0;i<txt.length;i++){
    var ch=txt[i];
    if(ch>="A"&&ch<="Z"){ legs.push({c:ch,s:null}); }
    else if(ch==="+"){ if(legs.length) legs[legs.length-1].s=1; }
    else if(ch==="-"||ch==="\u2212"){ if(legs.length) legs[legs.length-1].s=-1; }
    else if(ch>="0"&&ch<="9"){ dig+=ch; }
  }
  if(legs.length>2) err="Two letters max";
  var w = dig===""?null:parseInt(dig,10);
  if(w!==null&&(w<1||w>13)) err=err||"Winning row is 1 to 13";
  legs.forEach(function(l,i){ if(l.s===null) l.s=sg[Math.min(i,sg.length-1)]; l.r=rowOf(l.c); });
  return {legs:legs.slice(0,2), w:w, err:err};
}

function evaluate(p){
  if(p.err||!p.legs.length) return null;
  var A=0,n=0;
  p.legs.forEach(function(l){A+=l.s*l.r;n+=l.s;});
  if(n===0) return {A:A,n:n,v:A,certain:true};
  if(p.w===null) return {A:A,n:n,pending:true};
  var wins=0; for(var x=1;x<=13;x++) if(A-n*x>0) wins++;
  return {A:A,n:n,v:A-n*p.w,wins:wins};
}

function labelOf(legs){
  return legs.map(function(l){return l.c+(l.s>0?"+":"\u2212")}).join("");
}

function viewOf(p,st,ev){
  if(!st) return {num:null,expr:"",legs:p?p.legs:[],warn:!!(p&&p.err),
    note:(p&&p.err)?p.err:"Type letters, then the winning row"};
  if(st.pending) return {num:null,legs:p.legs,warn:false,
    expr:fmt(st.A)+(st.n>0?" \u2212 ":" + ")+(Math.abs(st.n)>1?Math.abs(st.n):"")+"w",
    note:"Enter for EV at row 7"};
  var expr,note;
  if(st.certain){
    expr=p.legs.filter(function(l){return l.s>0})[0].r+" \u2212 "+
         p.legs.filter(function(l){return l.s<0})[0].r;
    note="Certain, any winning row";
  } else {
    var t=-st.n*p.w;
    expr=fmt(st.A)+(t>=0?" + ":" \u2212 ")+Math.abs(t);
    note=(ev?"EV at row 7":"Row "+p.w)+", profits on "+st.wins+" of 13";
  }
  return {num:st.v,expr:expr,legs:p.legs,note:note,warn:false};
}

function paint(v){
  var num=document.getElementById("num");
  num.textContent = v.num===null?"\u2014":fmt(v.num);
  num.className = "num "+(v.num===null?"none":v.num>0?"pos":v.num<0?"neg":"zero");
  document.getElementById("expr").textContent=v.expr;
  var lg=document.getElementById("legs"); lg.innerHTML="";
  v.legs.forEach(function(l){
    var d=document.createElement("span");
    d.className="leg "+(l.s>0?"p":"m");
    d.textContent=l.c+(l.s>0?"+":"\u2212")+" "+l.r;
    lg.appendChild(d);
  });
  var nt=document.getElementById("note");
  nt.className="note"+(v.warn?" warn":""); nt.textContent=v.note;
}

function render(){
  var v;
  if(inp.value==="" && frozen) v=frozen;
  else { var p=parse(inp.value,SHAPES[shape][1]); v=viewOf(p,evaluate(p),false); }
  paint(v);
  document.querySelectorAll(".sh").forEach(function(b,i){b.classList.toggle("on",i===shape);});
}

function commit(){
  var p=parse(inp.value,SHAPES[shape][1]), st=evaluate(p), ev=false;
  if(!st) return;
  if(st.pending){ p.w=7; ev=true; st=evaluate(p); }
  log.unshift({k:labelOf(p.legs), w:st.certain?"any w":(ev?"EV":"w"+p.w), v:st.v});
  if(log.length>10) log.pop();
  frozen=viewOf(p,st,ev);
  inp.value=""; drawLog(); render();
}

function drawLog(){
  var best=log.length>1?Math.max.apply(null,log.map(function(e){return e.v})):null;
  var box=document.getElementById("log"); box.innerHTML="";
  log.forEach(function(e){
    var d=document.createElement("div");
    d.className="e"+(best!==null&&e.v===best?" best":"");
    d.innerHTML='<span class="b">'+e.k+'</span><span class="w">'+e.w+
      '</span><span class="v '+(e.v>0?"pos":e.v<0?"neg":"zero")+'">'+fmt(e.v)+'</span>';
    box.appendChild(d);
  });
}

var sw=document.getElementById("shapes");
SHAPES.forEach(function(sp,i){
  var b=document.createElement("button"); b.className="sh";
  b.innerHTML=sp[0].split("").map(function(g){
    return '<i class="'+(g==="+"?"a":"b")+'">'+g+'</i>';}).join("");
  b.setAttribute("aria-label",sp[1].map(function(x){return x>0?"plus":"minus"}).join(" "));
  b.addEventListener("mousedown",function(e){e.preventDefault();});
  b.addEventListener("touchstart",function(e){e.preventDefault();},{passive:false});
  b.onclick=function(){shape=i;frozen=null;render();inp.focus();};
  sw.appendChild(b);
});

inp.addEventListener("input",function(){frozen=null;render();});
inp.addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();commit();}
  if(e.key==="Escape"){inp.value="";frozen=null;render();}
});
document.getElementById("clr").onclick=function(){log=[];frozen=null;drawLog();render();inp.focus();};
document.querySelector(".entry").onclick=function(){inp.focus();};

render(); drawLog(); inp.focus();
</script>
</body>
</html>
